# Prometheus com Alertmanager — use no lugar de prometheus.yml quando
# COMPOSE_PROFILES incluir ``alerts``:
#   volumes:
#     - ./prometheus.alerts.yml:/etc/prometheus/prometheus.yml:ro
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: openmemory-api
    metrics_path: /metrics
    static_configs:
      - targets: ["openmemory-mcp:8765"]
