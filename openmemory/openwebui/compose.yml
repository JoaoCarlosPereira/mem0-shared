services:
  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_OLLAMA_API: "true"
      ENABLE_OPENAI_API: "false"
      DEFAULT_MODELS: gemma4:cloud
      DEFAULT_PINNED_MODELS: gemma4:cloud
      DEFAULT_MODEL_METADATA: '{"toolIds":["server:mcp:sharemem"]}'
      WEBUI_NAME: Open WebUI - ShareMem
      ENABLE_SIGNUP: "true"
      TOOL_SERVER_CONNECTIONS: >-
        [{"url":"http://openmemory-mcp:8765/mcp/openwebui/http/openwebui","path":"","type":"mcp","auth_type":"none","headers":null,"key":null,"config":{"enable":true},"info":{"id":"sharemem","name":"ShareMem","description":"Shared Memory for AI Engineering Agents — busca e gravação via MCP ShareMem"}}]
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - openmemory

volumes:
  openwebui_data:
    name: openwebui_data

networks:
  openmemory:
    external: true
    name: openmemory_default
